services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pcd
      POSTGRES_USER: pcd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcd -d pcd"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
